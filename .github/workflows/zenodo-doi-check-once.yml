name: Verify published Zenodo DOI once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zenodo-doi-check-once.yml'

permissions:
  contents: read

jobs:
  find-archived-version:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query public Zenodo records for the release DOI
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error, time
          query='When Tool Interfaces Lose Evidence Needed for Action'
          base='https://zenodo.org/api/records?q='+urllib.parse.quote(query)+'&size=50'
          badge='https://zenodo.org/badge/latestdoi/1466915084'
          for attempt in range(12):
              try:
                  req=urllib.request.Request(base,headers={'User-Agent':'S2AI-Citation-Verification/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      data=json.load(response)
                  results=[]
                  for rec in data.get('hits',{}).get('hits',[]):
                      m=rec.get('metadata',{})
                      title=m.get('title','')
                      if 'When Tool Interfaces Lose Evidence Needed for Action' not in title:
                          continue
                      creators=[v.get('person_or_org',{}).get('name',v.get('name','')) for v in m.get('creators',[])]
                      doi=rec.get('pids',{}).get('doi',{}).get('identifier') or m.get('doi')
                      results.append({'id':rec.get('id'),'title':title,'version':m.get('version'),'creators':creators,'doi':doi,'url':rec.get('links',{}).get('self_html') or rec.get('links',{}).get('self')})
                  if results:
                      print('ZENODO_MATCHES='+json.dumps(results,ensure_ascii=False))
                      exact=[r for r in results if r['doi'] and ('Reproducibility Artifact' in r['title'])]
                      if exact:
                          print('VERIFIED_DOI='+json.dumps(exact[0]))
                          raise SystemExit(0)
                  else:
                      print('No matching published record in Zenodo search, attempt',attempt+1,flush=True)
              except Exception as e:
                  print('Zenodo API query error:',type(e).__name__,str(e)[:240],flush=True)
              try:
                  class NoFollow(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self,req,fp,code,msg,headers,newurl):
                          return None
                  opener=urllib.request.build_opener(NoFollow)
                  try:
                      opener.open(urllib.request.Request(badge,headers={'User-Agent':'S2AI-Citation-Verification/1.0'}),timeout=20)
                  except urllib.error.HTTPError as e:
                      location=e.headers.get('Location','')
                      if '10.5281/zenodo.' in location:
                          print('ZENODO_BADGE_DOI_REDIRECT='+location)
              except Exception as e:
                  print('Zenodo badge query error:',str(e)[:120])
              time.sleep(15)
          print('No DOI verified after all attempts')
          PY
