name: E5 independent agentgrep MCP paging replay

on:
  push:
    branches:
      - e5-agentgrep-cross-source-20261121
    paths:
      - 'experiments/e5/**'
      - '.github/workflows/e5-agentgrep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install original Python 3.14 runtime
        run: |
          uv python install 3.14
          uv --version
      - name: Fetch two exact historical agentgrep commits
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet upstream
          git -C upstream remote add origin https://github.com/tony/agentgrep.git
          git -C upstream fetch --quiet --no-tags --filter=blob:none origin \
            9b5ccda643f2bf84c49b0ec1c4ae300b681a5f83 \
            6b2d3465767421f113acf684473384db00ebf619
          git -C upstream worktree add --quiet --detach ../agentgrep-before 9b5ccda643f2bf84c49b0ec1c4ae300b681a5f83
          git -C upstream worktree add --quiet --detach ../agentgrep-after 6b2d3465767421f113acf684473384db00ebf619
          test "$(git -C agentgrep-before rev-parse HEAD)" = "9b5ccda643f2bf84c49b0ec1c4ae300b681a5f83"
          test "$(git -C agentgrep-after rev-parse HEAD)" = "6b2d3465767421f113acf684473384db00ebf619"
          test -z "$(git -C agentgrep-before status --porcelain)"
          test -z "$(git -C agentgrep-after status --porcelain)"
          git -C agentgrep-before hash-object src/agentgrep/mcp/tools/search_tools.py
          git -C agentgrep-after hash-object src/agentgrep/mcp/tools/search_tools.py
      - name: Install original frozen dependency environments
        shell: bash
        run: |
          set -euo pipefail
          (cd agentgrep-before && uv sync --frozen --no-dev --python 3.14)
          (cd agentgrep-after && uv sync --frozen --no-dev --python 3.14)
          agentgrep-before/.venv/bin/python --version
          agentgrep-after/.venv/bin/python --version
      - name: Replay original MCP before merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          agentgrep-before/.venv/bin/python experiments/e5/replay_agentgrep.py \
            --source agentgrep-before --revision before --output results/e5_before.json \
            | tee results/e5_before.log
      - name: Replay original MCP after merge
        shell: bash
        run: |
          set -euo pipefail
          agentgrep-after/.venv/bin/python experiments/e5/replay_agentgrep.py \
            --source agentgrep-after --revision after --output results/e5_after.json \
            | tee results/e5_after.log
      - name: Held-out three-hit pagination integrity probe
        shell: bash
        run: |
          set -euo pipefail
          agentgrep-before/.venv/bin/python experiments/e5/probe_long_pages.py \
            --source agentgrep-before --revision before --output results/e5_probe_before.json \
            | tee results/e5_probe_before.log
          agentgrep-after/.venv/bin/python experiments/e5/probe_long_pages.py \
            --source agentgrep-after --revision after --output results/e5_probe_after.json \
            | tee results/e5_probe_after.log
      - name: Independent source-agnostic comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/e5/verify_pair.py results/e5_before.json results/e5_after.json \
            --probe-before results/e5_probe_before.json \
            --probe-after results/e5_probe_after.json \
            --output results/e5_pair.json | tee results/e5_pair.log
      - name: Capture exact dependency manifests
        shell: bash
        run: |
          uv pip freeze --python agentgrep-before/.venv/bin/python > results/e5_packages_before.txt
          uv pip freeze --python agentgrep-after/.venv/bin/python > results/e5_packages_after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e5-independent-source-paging-verified
          path: results/
          if-no-files-found: warn
          retention-days: 60

  archive-e5:
    if: github.ref == 'refs/heads/e5-agentgrep-cross-source-20261121'
    needs: original-before-after
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e5-independent-source-paging-verified
          path: results
      - name: Check and archive synthetic-only source evidence
        run: |
          python3 experiments/e5/publish_results.py --source results --dest evidence/e5
      - name: Regenerate complete tracked-file SHA-256 inventory
        shell: bash
        run: |
          set -euo pipefail
          git add evidence/e5/
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          manifest=Path("EVIDENCE_SHA256SUMS.txt")
          rows=[]
          for raw in subprocess.check_output(["git","ls-files","-z"]).split(b"\0"):
              if not raw: continue
              name=os.fsdecode(raw)
              if name == manifest.as_posix(): continue
              p=Path(name)
              assert p.is_file(), name
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {name}")
          manifest.write_text("\n".join(sorted(rows))+"\n",encoding="utf-8")
          print("Manifest covers",len(rows),"tracked files")
          PY
      - name: Audit complete frozen public repository
        run: |
          python3 scripts/verify_public.py
      - name: Commit approved experiment evidence and hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/e5 EVIDENCE_SHA256SUMS.txt
          git diff --cached --check
          git commit -m "Archive E5 original agentgrep replay and complete public integrity manifest"
          git push origin HEAD:refs/heads/e5-agentgrep-cross-source-20261121
