name: Publish verified S2AI artifact once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-s2ai-once.yml'

permissions:
  contents: read

jobs:
  verify-frozen-snapshot:
    if: "github.event.head_commit.message == 'release: publish approved S2AI artifact v1.0.0'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae377ef24b88cd58c9431e7ee8c6d9d9b96138d1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source, reproducible results, and disclosure boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ae377ef24b88cd58c9431e7ee8c6d9d9b96138d1"
          python3 scripts/verify_public.py --g9
          python3 scripts/replay_discovery37.py --verify experiments/discovery37/results
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('.zenodo.json').read_text())
          assert j['upload_type']=='software'
          assert j['creators']==[{'name':'Lee, Moon Hwan','affiliation':'RISU Institute'}]
          assert Path('CITATION.cff').read_text().startswith('cff-version: 1.2.0')
          print('Zenodo and GitHub citation metadata verified')
          PY

  publish:
    needs: verify-frozen-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the single versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: risu-research/tool-evidence-loss
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; refusing to overwrite it'
            exit 1
          fi
          gh release create v1.0.0 \
            --target 'ae377ef24b88cd58c9431e7ee8c6d9d9b96138d1' \
            --title 'S2AI 2026 Reproducibility Artifact v1.0.0' \
            --notes 'Frozen source and execution artifacts for When Tool Interfaces Lose Evidence Needed for Action. Includes Discovery 37, G7-G9, E1-E3 original MCP server executions with local HTTP write receipts, E4 historical Agno repair, and E5 independent original agentgrep pagination replay. Original third-party source revisions are pinned by commits and Git blobs. Synthetic fixtures only. Reproduce and verify using README.md and scripts/verify_public.py. Licensing and provenance are in THIRD_PARTY_NOTICES.md and docs/provenance.md.'
