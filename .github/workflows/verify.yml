name: Verify evidence and reproduce runtimes

on:
  push:
    branches:
      - main
      - artifact-audit-20261121
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-evidence:
    name: Hashes, provenance and G9 replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen inputs, archived outcomes, and public-file scope
        run: python3 scripts/verify_public.py --g9

  e1-replay:
    name: E1 real source-branch and comparison
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed TypeScript compiler
        run: npm install --global --no-audit --no-fund typescript@5.8.3
      - name: Rerun both source-level implementations
        working-directory: experiments/e1
        run: bash run_all.sh
      - name: Compare recorded results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=Path('experiments/e1/results')
          b=Path('evidence/e1')
          checks=json.loads((a/'checks.json').read_text())
          expected=json.loads((b/'checks.json').read_text())
          assert checks==expected
          for name in ['results.json','control.json']:
              fresh=json.loads((a/name).read_text())
              historical=json.loads((b/name).read_text())
              assert fresh['runtime']['node'].startswith('v22.')
              assert historical['runtime']['node'].startswith('v22.')
              fresh['runtime'].pop('node')
              historical['runtime'].pop('node')
              assert fresh==historical, name
          print('E1 source replay equals recorded evidence')
          PY

  original-agents-sdk:
    name: Official SDK replay / ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stage: [g7, g8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy frozen source to isolated run directory
        shell: bash
        run: cp -a "experiments/${{ matrix.stage }}" "$RUNNER_TEMP/${{ matrix.stage }}"
      - name: Install pinned SDK packages
        working-directory: ${{ runner.temp }}/${{ matrix.stage }}
        run: npm ci --no-audit --no-fund
      - name: Execute original SDK runner
        shell: bash
        working-directory: ${{ runner.temp }}/${{ matrix.stage }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.stage }}" == 'g7' ]]; then node run_agents_official.mjs; else node run_http.mjs; fi
      - name: Compare new result with original recorded evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          stage='${{ matrix.stage }}'
          frozen=Path('experiments')/stage
          new=Path(os.environ['RUNNER_TEMP'])/stage
          names=['official-runtime-summary.json','official-runtime-rows.json','projection-ledger.json','source-ledger.json'] if stage=='g7' else ['http-summary.json','http-rows.json','http-projection-ledger.json','http-source-ledger.json']
          for name in names:
              original=json.loads((frozen/name).read_text())
              reproduced=json.loads((new/name).read_text())
              assert original==reproduced,(stage,name)
          print(stage,'fresh official SDK replay matches 4 archived JSON outputs')
          PY

  source-identity:
    name: Compare 14 original source files and 2 third-party implementations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Match historical source bytes to archived input
        shell: bash
        run: |
          set -euo pipefail
          g7root='https://raw.githubusercontent.com/risu-research/formal-exec-2609/8ad25af26a2f6d78f98a5c5c0b280220377254e8/runs/s2ai-official-runtime'
          g8root='https://raw.githubusercontent.com/risu-research/stc-exec-2609/dadb9417bec502ba620b8b081343325f99b48cbb/transport-confirm'
          for f in package.json package-lock.json expected_sealed.json server_cases.json source_oracle.mjs mcp_server_official.mjs run_agents_official.mjs; do
            curl --fail --silent --show-error --location --retry 3 "$g7root/$f" | cmp - "experiments/g7/$f"
          done
          for f in package.json package-lock.json cases.json expected.json oracle.mjs http_server.mjs run_http.mjs; do
            curl --fail --silent --show-error --location --retry 3 "$g8root/$f" | cmp - "experiments/g8/$f"
          done
          echo '14 original SDK source files match their pinned historical GitHub bytes'
      - name: Match external Google Drive MCP implementations
        shell: bash
        run: |
          set -euo pipefail
          target='https://raw.githubusercontent.com/piotr-agier/google-drive-mcp/9509fb8bba8ad15f7cdb79a54dbd850c13eb058b/src/tools/drive.ts'
          control='https://raw.githubusercontent.com/domdomegg/google-drive-mcp/395971084f5d8504e5b2934dab4c2cc6e2f210b5/src/tools/files-list.ts'
          test "$(curl --fail --silent --show-error --location --retry 3 "$target" | git hash-object --stdin)" = 'a32a46a470d1ee14a5fa9a81a3885eb8dbd29739'
          curl --fail --silent --show-error --location --retry 3 "$control" | cmp - experiments/e1/upstream_control_files_list.ts
          echo '2 original third-party implementations match pinned source identities'

  full-upstream-mcp:
    name: E2 + E3 full upstream MCP over stdio and loopback HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain immutable upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/piotr-agier/google-drive-mcp.git upstream
          git -C upstream checkout --quiet 9509fb8bba8ad15f7cdb79a54dbd850c13eb058b
          test "$(git -C upstream rev-parse HEAD)" = '9509fb8bba8ad15f7cdb79a54dbd850c13eb058b'
          test -z "$(git -C upstream status --porcelain)"
      - name: Install upstream dependencies and attach independent tests
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          npm ci --ignore-scripts --no-audit --no-fund
          cp ../experiments/e2/*.ts test/integration/
          cp ../experiments/e3/*.ts test/integration/
          git status --short
      - name: Compile the complete original MCP server and 3 integration modules
        working-directory: upstream
        run: npm run test:build
      - name: Run in-memory, child-process stdio, and stateful HTTP effect tests
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          MCP_TESTING=1 node --test \
            .tmp-test/test/integration/s2ai_mcp_full_runtime.test.js \
            .tmp-test/test/integration/s2ai_stdio_client.test.js \
            .tmp-test/test/integration/e3_downstream_effect.test.js | tee ../upstream-test.log
      - name: Check independent result and HTTP-effect evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          saved=Path('evidence')
          fresh=Path('upstream/results')
          a=json.loads((fresh/'s2ai_full_runtime.json').read_text())
          b=json.loads((fresh/'s2ai_stdio_runtime.json').read_text())
          expected_a=json.loads((saved/'e2/s2ai_full_runtime.json').read_text())
          expected_b=json.loads((saved/'e2/s2ai_stdio_runtime.json').read_text())
          assert a['checks']==expected_a['checks']
          assert b['checks']==expected_b['checks']
          assert a['observations'][1]['hash_a']==expected_a['observations'][1]['hash_a']
          assert b['sha256']==expected_b['sha256']
          e=json.loads((fresh/'e3_downstream_report.json').read_text())
          old=json.loads((saved/'e3/e3_downstream_report.json').read_text())
          assert e['summary']==old['summary']=={'count':5,'writes':3,'unlicensed_writes':1}
          receipts=[json.loads(x) for x in (fresh/'e3_provider_writes.jsonl').read_text().splitlines()]
          assert receipts==e['provider_writes']
          assert [x['name'] for x in e['run_cases']]==[x['name'] for x in old['run_cases']]
          assert [x['executed'] for x in e['run_cases']]==[x['executed'] for x in old['run_cases']]
          print('E2 2 transports and E3 HTTP write/readback match archival controls')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-mcp-replay-results
          if-no-files-found: warn
          retention-days: 30
          path: |
            upstream-test.log
            upstream/results/s2ai_full_runtime.json
            upstream/results/s2ai_stdio_runtime.json
            upstream/results/e3_downstream_report.json
            upstream/results/e3_provider_writes.jsonl
