name: Verify exact Zenodo record before citation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zenodo-record-once.yml'

permissions:
  contents: read

jobs:
  verify-doi-record:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Zenodo record 24431133 against v1.0.0
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          endpoints=[
            'https://zenodo.org/api/records/24431133',
            'https://zenodo.org/records/24431133/export/json'
          ]
          for url in endpoints:
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'S2AI-Public-Record-Verification/1.0','Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=25) as res:
                raw=res.read()
                obj=json.loads(raw)
              meta=obj.get('metadata',obj)
              info={'id':obj.get('id'),'doi':obj.get('doi') or meta.get('doi') or obj.get('pids',{}).get('doi',{}).get('identifier'),'conceptdoi':obj.get('conceptdoi'),'conceptrecid':obj.get('conceptrecid'),'title':meta.get('title') or obj.get('title'),'version':meta.get('version'),'publication_date':meta.get('publication_date'),'creators':meta.get('creators'),'related_identifiers':meta.get('related_identifiers'),'links':obj.get('links'),'files':[{'key':f.get('key'),'size':f.get('size'),'checksum':f.get('checksum')} for f in obj.get('files',[])][:6]}
              print('ZENODO_VERIFIED_METADATA='+json.dumps(info,ensure_ascii=False),flush=True)
              doi=info['doi'] or ''
              assert 'When Tool Interfaces Lose Evidence Needed for Action' in str(info['title'])
              assert doi.startswith('10.5281/zenodo.')
              assert any('Lee' in str(c.get('name','')) or 'Lee' in str(c.get('person_or_org',{}).get('name','')) for c in info['creators'] or [])
              print('ZENODO_PAPER_TITLE_AUTHOR_MATCH=YES',flush=True)
              raise SystemExit(0)
            except Exception as e:
              print('ZENODO_RECORD_ATTEMPT='+url+' '+repr(e),flush=True)
          raise SystemExit('Could not verify Zenodo record')
          PY
